name: Validate photo pilot

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JSON schemas
        run: python -m json.tool schemas/foto.schema.json >/tmp/foto.schema.json

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate Markdown records
        run: python scripts/validate.py
